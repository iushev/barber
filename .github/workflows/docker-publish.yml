name: Docker образ → GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (semver, напр. 1.2.3 или 1.3.0-rc.1). Празно = само latest + sha"
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build и push на production образа
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Приема и водещо "v" (v1.2.3 → 1.2.3). Build metadata (+...) не е позволена,
      # защото "+" е невалиден символ в Docker таг.
      - name: Проверка на версията
        id: version
        if: inputs.version != ''
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          v="${RAW_VERSION#v}"
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$v" =~ $re ]]; then
            echo "::error::'$RAW_VERSION' не е валидна semver версия (очаква се напр. 1.2.3 или 1.2.3-rc.1)."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          [[ "$v" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login в GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Името в GHCR трябва да е с малки букви.
      - name: Тагове и етикети
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # latest — само от default клона и никога за pre-release (1.3.0-rc.1 и т.н.).
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.version.outputs.prerelease != 'true' }}
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}

      - name: Build и push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One-shot образ за n8n-setup (workflow-ите + n8n/setup.mjs) със същите тагове,
      # за да се деплойва с един APP_IMAGE_TAG.
      - name: Тагове и етикети (n8n-setup)
        id: meta-n8n
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}-n8n-setup
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.version.outputs.prerelease != 'true' }}
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}

      - name: Build и push (n8n-setup)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./n8n
          push: true
          tags: ${{ steps.meta-n8n.outputs.tags }}
          labels: ${{ steps.meta-n8n.outputs.labels }}
          cache-from: type=gha,scope=n8n-setup
          cache-to: type=gha,mode=max,scope=n8n-setup
