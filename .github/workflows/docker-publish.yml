name: Docker образ → GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (semver, напр. 1.2.3 или 1.3.0-rc.1). Празно = само latest + sha"
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build и push на production образа
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Приема и водещо "v" (v1.2.3 → 1.2.3). Build metadata (+...) не е позволена,
      # защото "+" е невалиден символ в Docker таг.
      - name: Проверка на версията
        id: version
        if: inputs.version != ''
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          v="${RAW_VERSION#v}"
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$v" =~ $re ]]; then
            echo "::error::'$RAW_VERSION' не е валидна semver версия (очаква се напр. 1.2.3 или 1.2.3-rc.1)."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Името в GHCR трябва да е с малки букви.
      - name: Тагове и етикети
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}

      - name: Build и push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
