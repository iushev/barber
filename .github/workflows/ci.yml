name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, типове, миграции, тестове, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: barbershop
          POSTGRES_PASSWORD: barbershop
          POSTGRES_DB: barbershop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U barbershop -d barbershop_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://barbershop:barbershop@127.0.0.1:5432/barbershop_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint
      - name: Типове
        run: npm run typecheck
      - name: Форматиране
        run: npm run format:check

      - name: Drizzle — консистентност на миграциите
        run: npx drizzle-kit check
      - name: Drizzle — схемата няма незаписани промени
        run: |
          npx drizzle-kit generate
          git status --porcelain drizzle/
          test -z "$(git status --porcelain drizzle/)" || {
            echo "::error::src/db/schema.ts е променен без миграция — пусни npm run db:generate и commit-ни drizzle/."
            exit 1
          }

      - name: n8n workflow-ите съответстват на генератора
        run: npm run n8n:build -- --check

      - name: Unit + интеграционни тестове (Postgres)
        run: npm test

      - name: Build
        run: npm run build
